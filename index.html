<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculado de Investimentos Mafra</title>
    <script type="module" crossorigin src="/projeto-calculadora-investimentos/assets/index-BOBSNwBc.js"></script>
    <link rel="stylesheet" crossorigin href="/projeto-calculadora-investimentos/assets/index-CenpAeJs.css">
  </head>
  <body class="grid grid-cols-3 grid-rows-2 h-dvh">
    <aside
      class="relative row-span-full col-span-1 flex flex-col justify-between py-5 px-2 h-screen bg-emerald-300 z-20 shadow-[6px_0_20px_rgba(0,0,0,0.25)]"
    >
      <!-- Background image -->
      <div
        class="absolute inset-0 bg-[url(/src/img/investment-bg.jpg)] bg-cover bg-center opacity-20"
      ></div>
      <!-- Conteúdo -->
      <div
        class="relative flex flex-col justify-between z-10 h-screen justify-between overflow-hidden"
      >
        <div>
          <h1 class="text-2xl font-bold px-6 text-center">
            Calculadora de Investimentos
          </h1>
          <img
            class="w-30 mx-auto mt-4"
            src="/projeto-calculadora-investimentos/assets/money-growth-CEoe49TB.png"
            alt="money growth icon"
          />
        </div>
        <form id="investment-form" class="w-full">
          <!-- Investimento inicial -->
          <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
            <label for="starting-amount" class="font-bold text-gray-700"
              >Investimento inicial</label
            >
            <div class="flex border-slate-200 border-1 rounded-xl shadow-md">
              <input
                type="text"
                disabled
                value="R$"
                class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
              />
              <input
                type="number"
                id="starting-amount"
                class="bg-white w-5/6 rounded-r-lg px-2"
                placeholder="0,00"
                step=".01"
                required
              />
            </div>
          </div>
          <!-- Aportes adicionais -->
          <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
            <label for="additional-contribution" class="font-bold text-gray-700"
              >Aportes adicionais</label
            >
            <div class="flex border-slate-200 border-1 rounded-xl shadow-md">
              <input
                type="text"
                disabled
                value="R$"
                class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
              />
              <input
                type="number"
                id="additional-contribution"
                class="bg-white w-5/6 rounded-r-lg px-2"
                placeholder="0,00"
                step=".01"
              />
            </div>
          </div>
          <!-- Prazo -->
          <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
            <label for="time-amount" class="font-bold text-gray-700"
              >Prazo</label
            >
            <div class="flex border-slate-200 border-1 rounded-xl shadow-md">
              <input
                type="number"
                id="time-amount"
                class="bg-white w-4/6 rounded-l-lg px-2"
                placeholder="0"
                required
              />
              <select
                name=""
                id="time-amount-period"
                class="bg-white w-2/6 text-center rounded-r-lg border-l-1 border-emerald-500 hover:bg-emerald-950 hover:text-slate-200"
              >
                <option value="monthly">Mensal</option>
                <option value="yearly">Anual</option>
              </select>
            </div>
          </div>
          <!-- Rentabilidade -->
          <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
            <label for="return-rate" class="font-bold text-gray-700"
              >Rentabilidade</label
            >
            <div class="flex border-slate-200 border-1 rounded-xl shadow-md">
              <input
                type="text"
                disabled
                value="%"
                class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
              />
              <input
                type="number"
                id="return-rate"
                class="bg-white w-3/6 px-2"
                placeholder="0,00"
                step=".01"
                required
              />
              <select
                name=""
                id="return-rate-period"
                class="bg-white w-2/6 text-center rounded-r-lg border-l-1 border-emerald-500 hover:bg-emerald-950 hover:text-slate-200"
              >
                <option value="monthly">Mensal</option>
                <option value="yearly">Anual</option>
              </select>
            </div>
          </div>
          <!-- Impostos sobre lucro -->
          <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
            <label for="tax-rate" class="font-bold text-gray-700"
              >Impostos sobre lucro</label
            >
            <div class="flex border-slate-200 border-1 rounded-xl shadow-md">
              <input
                type="text"
                disabled
                value="%"
                class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
              />
              <input
                type="number"
                id="tax-rate"
                class="bg-white w-5/6 rounded-r-lg px-2"
                placeholder="0,00"
                step=".01"
                required
              />
            </div>
          </div>
        </form>
        <div class="flex h-12 px-6 my-8 w-full gap-2">
          <button
            class="w-1/2 rounded-lg bg-emerald-950 text-slate-200 hover:bg-emerald-800 shadow-md"
            id="calculate-results"
            form="investment-form"
            type="submit"
          >
            Calcular
          </button>
          <button
            class="w-1/2 rounded-lg hover:bg-emerald-500 border-2 border-emerald-500 shadow-md"
            id="clear-button"
          >
            Limpar
          </button>
        </div>
      </div>
    </aside>
    <div
      id="result-placeholder"
      class="row-span-full col-span-2 flex flex-col justify-center text-center"
    >
      <h3 class="text-gray-700">Aguardando dados...</h3>
    </div>
    <main
      id="result-container"
      class="row-span-full col-span-2 relative hidden"
    >
      <button
        id="slide-arrow-previous"
        class="absolute z-10 top-0 bottom-0 left-0 text-5xl cursor-pointer bg-slate-200 w-8 opacity-50 hover:opacity-100 focus:opacity-100 hidden"
      >
        &#8249;
      </button>
      <button
        id="slide-arrow-next"
        class="absolute z-10 top-0 bottom-0 right-0 text-5xl cursor-pointercursor-pointer bg-slate-200 w-8 opacity-50 hover:opacity-100 focus:opacity-100"
      >
        &#8250;
      </button>
      <div
        id="carousel-container"
        class="h-full w-full flex overflow-auto scroll-smooth scrollbar-hidden"
      >
        <section
          id="charts-container"
          class="h-full basis-full shrink-0 pr-8 pl-2"
        >
          <div
            class="h-[36%] flex flex-col items-center relative pb-10 pl-4 pr-4"
          >
            <p class="font-bold text-lg">Resultado Final</p>
            <canvas id="final-money-distribution"></canvas>
          </div>
          <div
            class="h-[56%] flex flex-col items-center relative pl-4 pr-4 pb-10"
          >
            <p class="font-bold text-lg">Progressão</p>
            <canvas id="progression"></canvas>
          </div>
        </section>
        <section
          id="table-container"
          class="h-full overflow-y-auto basis-full shrink-0 pl-10"
        >
          <p class="font-bold text-lg text-center">Resultados mensais</p>
          <table
            id="results-table"
            class="max-h-full w-full border border-separate table-auto relative"
          ></table>
        </section>
      </div>
    </main>
  </body>
</html>
