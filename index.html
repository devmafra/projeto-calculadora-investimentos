<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculado de Investimentos Mafra</title>
  </head>
  <body class="grid grid-cols-3 grid-rows-2 h-dvh">
    <aside
      class="bg-emerald-300 row-span-full col-span-1 flex flex-col justify-between py-5 px-2"
    >
      <h1 class="text-2xl font-bold px-6">Calculadora de Investimentos</h1>
      <form id="investment-form" class="w-full">
        <!-- Investimento inicial -->
        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label for="starting-amount" class="font-bold text-gray-700"
            >Investimento inicial</label
          >
          <div class="flex">
            <input
              type="text"
              disabled
              value="R$"
              class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
            />
            <input
              type="number"
              id="starting-amount"
              class="bg-white w-5/6 rounded-r-lg px-2"
              placeholder="0,00"
              step=".01"
              required
            />
          </div>
        </div>
        <!-- Aportes adicionais -->
        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label for="additional-contribution" class="font-bold text-gray-700"
            >Aportes adicionais</label
          >
          <div class="flex">
            <input
              type="text"
              disabled
              value="R$"
              class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
            />
            <input
              type="number"
              id="additional-contribution"
              class="bg-white w-5/6 rounded-r-lg px-2"
              placeholder="0,00"
              step=".01"
            />
          </div>
        </div>
        <!-- Prazo -->
        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label for="time-amount" class="font-bold text-gray-700">Prazo</label>
          <div class="flex">
            <input
              type="number"
              id="time-amount"
              class="bg-white w-4/6 rounded-l-lg px-2"
              placeholder="0"
              required
            />
            <select
              name=""
              id="time-amount-period"
              class="bg-white w-2/6 text-center rounded-r-lg border-l-1 border-emerald-500 hover:bg-emerald-950 hover:text-slate-200"
            >
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
        </div>
        <!-- Rentabilidade -->
        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label for="return-rate" class="font-bold text-gray-700"
            >Rentabilidade</label
          >
          <div class="flex">
            <input
              type="text"
              disabled
              value="%"
              class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
            />
            <input
              type="number"
              id="return-rate"
              class="bg-white w-3/6 px-2"
              placeholder="0,00"
              step=".01"
              required
            />
            <select
              name=""
              id="return-rate-period"
              class="bg-white w-2/6 text-center rounded-r-lg border-l-1 border-emerald-500 hover:bg-emerald-950 hover:text-slate-200"
            >
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
        </div>
        <!-- Impostos sobre lucro -->
        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label for="tax-rate" class="font-bold text-gray-700"
            >Impostos sobre lucro</label
          >
          <div class="flex">
            <input
              type="text"
              disabled
              value="%"
              class="bg-emerald-200 w-1/6 text-center rounded-l-lg"
            />
            <input
              type="number"
              id="tax-rate"
              class="bg-white w-5/6 rounded-r-lg px-2"
              placeholder="0,00"
              step=".01"
              required
            />
          </div>
        </div>
      </form>
      <div class="flex h-12 px-6 my-8 w-full gap-2">
        <button
          class="w-1/2 rounded-lg bg-emerald-950 text-slate-200 hover:bg-emerald-800"
          id="calculate-results"
          form="investment-form"
          type="submit"
        >
          Calcular
        </button>
        <button
          class="w-1/2 rounded-lg hover:bg-emerald-500 border-1 border-emerald-500"
          id="clear-button"
        >
          Limpar
        </button>
      </div>
    </aside>
    <main class="row-span-full col-span-2">
      <section class="h-full" id="charts-container">
        <div
          class="h-[36%] flex flex-col items-center relative pb-10 pl-4 pr-4"
        >
          <p class="font-bold text-lg">Resultado Final</p>
          <canvas id="final-money-distribution"></canvas>
        </div>
        <div
          class="h-[56%] flex flex-col items-center relative pl-4 pr-4 pb-10"
        >
          <p class="font-bold text-lg">Progressão</p>
          <canvas id="progression"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
